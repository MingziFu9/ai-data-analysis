<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据脱敏演示</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
table.t td { text-align:left; }
table.t select { font-size:13px; padding:2px 4px; }
#sc button { margin:2px; }
.meter { height:14px; border-radius:7px; background:#eceff1; overflow:hidden; }
.meter div { height:100%; transition:width .25s; }
.out { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px; }
</style>
</head>
<body>
<h1>数据脱敏演示：同一条记录，选不同的脱敏方法</h1>
<div class="sub">这是“食客说”用户表中的一条记录。先选一个使用场景，再给每个字段选一种处理方法，看处理后的样子、数据还能不能用、泄露风险有多大。</div>
<div class="row"><b style="font-size:13px">使用场景：</b><span id="sc"></span></div>
<table class="t" id="tb"></table>
<div class="grid2" style="margin-top:8px">
  <div><div style="font-size:13px">分析可用性 <b id="uv"></b></div><div class="meter"><div id="um" style="background:var(--pos)"></div></div></div>
  <div><div style="font-size:13px">泄露风险 <b id="rv"></b></div><div class="meter"><div id="rm" style="background:var(--neg)"></div></div></div>
</div>
<div class="msg" id="msg"></div>
<div class="note">掩码：用 * 遮住一部分；哈希：用加了“盐”的 SHA-256 换成一串乱码，同一个值永远得到同一串乱码，可以用来关联两张表，但推不回原值；泛化：降低精度，如地址只留到区、年龄换成年龄段；扰动：加一点随机误差；删除：整列不要。可用性和风险的打分是为教学设计的示意，不是国家标准的计算方法。</div>
<script>
(function () {
  var REC = { "姓名": "叶志霞", "手机号": "13051490103", "收货地址": "广州市天河区市桥大北路105号25栋1725房", "年龄": "23", "全年消费": "1543.0" };
  var M = {
    "姓名": { "保留": [REC["姓名"], 0, 10], "掩码": ["叶**", 1, 4], "哈希": ["a71f3c90e2b4", 2, 1], "删除": ["（已删除）", 3, 0] },
    "手机号": { "保留": [REC["手机号"], 0, 10], "掩码": ["130****0103", 1, 3], "哈希": ["f95cb3a3486d", 1, 1], "删除": ["（已删除）", 3, 0] },
    "收货地址": { "保留": [REC["收货地址"], 0, 8], "泛化": ["广州市天河区", 0, 1], "删除": ["（已删除）", 3, 0] },
    "年龄": { "保留": ["23", 0, 3], "泛化": ["18-24", 0, 1], "扰动": ["25（±3 随机误差）", 1, 1], "删除": ["（已删除）", 3, 0] },
    "全年消费": { "保留": ["1543.0", 0, 2], "泛化": ["1000～2000", 1, 1], "扰动": ["1597.3（±5% 随机误差）", 0, 1], "删除": ["（已删除）", 3, 0] }
  };
  var NEED = {
    "按城区统计用户数": { "收货地址": 2, "年龄": 0, "全年消费": 0, "姓名": 0, "手机号": 0 },
    "RFM 用户分群（第 9 章）": { "全年消费": 3, "收货地址": 0, "年龄": 0, "姓名": 0, "手机号": 0 },
    "客服回访差评用户": { "手机号": 3, "姓名": 1, "收货地址": 0, "年龄": 0, "全年消费": 0 },
    "交给外部公司做标注": { "姓名": 0, "手机号": 0, "收货地址": 0, "年龄": 0, "全年消费": 0 }
  };
  var BEST = {
    "按城区统计用户数": { "姓名": "删除", "手机号": "删除", "收货地址": "泛化", "年龄": "泛化", "全年消费": "删除" },
    "RFM 用户分群（第 9 章）": { "姓名": "删除", "手机号": "哈希", "收货地址": "删除", "年龄": "删除", "全年消费": "扰动" },
    "客服回访差评用户": { "姓名": "掩码", "手机号": "保留", "收货地址": "删除", "年龄": "删除", "全年消费": "删除" },
    "交给外部公司做标注": { "姓名": "删除", "手机号": "删除", "收货地址": "删除", "年龄": "删除", "全年消费": "删除" }
  };
  var scene = "按城区统计用户数", pick = {};
  Object.keys(M).forEach(function (f) { pick[f] = "保留"; });
  var sc = document.getElementById("sc");
  Object.keys(NEED).forEach(function (s) { var b = document.createElement("button"); b.textContent = s; b.onclick = function () { scene = s; draw(); }; sc.appendChild(b); });
  var bb = document.createElement("button"); bb.textContent = "看推荐做法"; bb.className = "main"; bb.style.marginLeft = "8px";
  bb.onclick = function () { pick = Object.assign({}, BEST[scene]); draw(); }; sc.appendChild(bb);
  function draw() {
    [].forEach.call(sc.children, function (b) { if (b !== bb) b.className = b.textContent === scene ? "on" : ""; });
    var h = "<tr><th>字段</th><th>原始值</th><th>处理方法</th><th>处理后</th><th>这个场景需要它吗</th></tr>", use = 0, need = 0, risk = 0, extra = 0;
    Object.keys(M).forEach(function (f) {
      var opt = M[f][pick[f]], n = NEED[scene][f];
      var sel = '<select data-f="' + f + '">' + Object.keys(M[f]).map(function (k) { return "<option" + (k === pick[f] ? " selected" : "") + ">" + k + "</option>"; }).join("") + "</select>";
      h += "<tr><td>" + f + '</td><td class="out">' + REC[f] + "</td><td>" + sel + '</td><td class="out">' + opt[0] + "</td><td>" + ["不需要", "有一点用", "需要粗略的", "必须要"][n] + "</td></tr>";
      need += n; use += n * Math.max(0, 3 - opt[1]) / 3; risk += opt[2]; if (n < 3) extra += opt[2] * (n ? 0.5 : 1);
    });
    document.getElementById("tb").innerHTML = h;
    [].forEach.call(document.querySelectorAll("select"), function (s) { s.onchange = function () { pick[s.dataset.f] = s.value; draw(); }; });
    var u = need ? Math.round(use / need * 100) : 100, r = Math.round(risk / 33 * 100);
    document.getElementById("uv").textContent = u + " 分"; document.getElementById("rv").textContent = r + " 分";
    document.getElementById("um").style.width = u + "%"; document.getElementById("rm").style.width = r + "%";
    var m;
    if (u >= 80 && extra <= 3 && r > 20) m = '<span style="color:var(--warn)">风险来自必须保留的字段</span>：这个场景离不开明文的个人信息，脱敏已经做到头了。剩下的风险要靠其他措施：只给需要的人看（权限控制）、记录谁在什么时候看过（操作记录）、用完就删。';
    else if (u >= 80 && r <= 20) m = '<span class="ok">很好</span>：这个场景需要的信息都保留了，泄露风险也很低。这正是“最小必要”原则：只留用得着的，用得着的也尽量降低精度。';
    else if (u < 80) m = '<span class="bad">可用性不够</span>：这个场景需要的字段被处理得太狠了，分析做不下去。看看“这个场景需要它吗”一列。';
    else m = '<span style="color:var(--warn)">风险偏高</span>：保留了这个场景用不着的个人信息。用不着的字段，能删就删。';
    document.getElementById("msg").innerHTML = m;
  }
  draw();
})();
</script>
</body>
</html>
