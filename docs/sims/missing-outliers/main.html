    });

    (lines || []).forEach(function (l) { var x = 30 + (l[0] - lo) / (hi - lo) * 560; if (x >= 30 && x <= 590) html += '<line x1="' + x + '" x2="' + x + '" y1="5" y2="' + H + '" stroke="' + l[1] + '" stroke-dasharray="4 3"/><text x="' + (x + 3) + '" y="14" font-size="11" fill="' + l[1] + '">' + l[2] + "</text>"; });
    svg.innerHTML = html;
  }
  function stat(el, items) { el.innerHTML = items.map(function (t) { return '<div class="stat">' + t[0] + "<b>" + t[1] + "</b></div>"; }).join(""); }
  // 一、异常值
  var method = "sigma", k = document.getElementById("k"), pv = PAY.map(function (p) { return p[0]; });
  function draw1() {
    var kv = +k.value, lo, hi;
    document.getElementById("m-sigma").className = method === "sigma" ? "on" : "";
    document.getElementById("m-iqr").className = method === "iqr" ? "on" : "";
    if (method === "sigma") { var m = mean(pv), s = std(pv); lo = m - kv * s; hi = m + kv * s; document.getElementById("klabel").textContent = "离平均值超过 " + kv + " 个标准差"; }
    else { var q1 = q(pv, .25), q3 = q(pv, .75), r = q3 - q1; lo = q1 - kv * r; hi = q3 + kv * r; document.getElementById("klabel").textContent = "超出四分位数 " + kv + " 倍 IQR"; }
    var out = PAY.filter(function (p) { return p[0] < lo || p[0] > hi; }), four = out.filter(function (p) { return p[1] === 4; }).length;
    hist(document.getElementById("h1"), pv, pv.map(function (v) { return v < lo || v > hi ? "#e53935" : "#7986cb"; }), 0, 950, 38, [[hi, "#e53935", "上界 " + hi.toFixed(0)]]);
    stat(document.getElementById("s1"), [["上界（元）", hi.toFixed(1)], ["判为异常", out.length + " 笔"], ["占比", (out.length / PAY.length * 100).toFixed(1) + "%"], ["其中 4 人聚餐", four + " 笔"]]);
    document.getElementById("m1").innerHTML = out.length ? "被判为“异常”的 " + out.length + " 笔里，有 " + four + " 笔是 4 人聚餐。它们金额大是因为人多、吃火锅西餐，是<b>真实的大单</b>，不是录入错误，不能直接删。阈值越小，被误伤的正常订单越多。" : "这个阈值下没有异常值。";
  }
  document.getElementById("m-sigma").onclick = function () { method = "sigma"; k.value = 3; draw1(); };
  document.getElementById("m-iqr").onclick = function () { method = "iqr"; k.value = 1.5; draw1(); };
  k.oninput = draw1;
  // 二、缺失值
  var HIDE = DIST.map(function (_, i) { return i % 10 === 3; }), fill = "median";
  var known = DIST.filter(function (_, i) { return !HIDE[i]; });
  var FILLS = [["drop", "删除这些行"], ["zero", "填 0"], ["mean", "填平均值"], ["median", "填中位数"], ["group", "按城区填中位数"]];
  FILLS.forEach(function (f) { var b = document.createElement("button"); b.textContent = f[1]; b.id = "f-" + f[0]; b.onclick = function () { fill = f[0]; draw2(); }; document.getElementById("fills").appendChild(b); });
  function draw2() {
    FILLS.forEach(function (f) { document.getElementById("f-" + f[0]).className = f[0] === fill ? "on" : ""; });
    var gm = {};
    DIS.forEach(function (d, i) { if (!HIDE[i]) (gm[d] = gm[d] || []).push(DIST[i]); });
    var vals = [], cols = [], err = [];
    DIST.forEach(function (v, i) {
      if (!HIDE[i]) { vals.push(v); cols.push("#7986cb"); return; }
      if (fill === "drop") return;
      var f = fill === "zero" ? 0 : fill === "mean" ? mean(known) : fill === "median" ? q(known, .5) : q(gm[DIS[i]], .5);
      vals.push(f); cols.push("#ef6c00"); err.push(Math.abs(f - v));
    });
    var trueMean = mean(DIST);
    hist(document.getElementById("h2"), vals, cols, 0, 10, 40, [[trueMean, "#43a047", "真实平均 " + trueMean.toFixed(2)]]);
    stat(document.getElementById("s2"), [["剩余行数", vals.length], ["处理后平均", mean(vals).toFixed(2) + " km"], ["处理后标准差", std(vals).toFixed(2)], ["填充值平均误差", err.length ? mean(err).toFixed(2) + " km" : "—"]]);
    var tip = { drop: "删除最简单，但丢掉了 40 笔订单的其他信息（金额、时长都是好的）。缺失少、且缺失是随机的时候可以用。",
      zero: "填 0 是最常见的错误：距离 0 公里不可能，平均值被明显拉低。只有“空就是没有”时才能填 0，例如“优惠金额”为空表示没优惠。",
      mean: "填平均值让平均值不变，但 40 个值挤在同一根柱子上，分布变“尖”，标准差变小。",
      median: "填中位数不受极端值影响，比平均值更稳。分布同样会在一个位置堆起来。",
      group: "按城区分别填中位数，利用了“同一城区距离相近”的信息，填充值的平均误差最小。这就是实验 4-2 的做法。" };
    document.getElementById("m2").innerHTML = "橙色是填进去的值。" + tip[fill] + " 无论哪种方法，填进去的都是“估计值”，所以实验 4-2 另加了一列“距离为填充值”做标记。";
  }
  draw1(); draw2();
})();
</script>
