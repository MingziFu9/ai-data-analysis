<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆分—应用—合并</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.stage { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; margin-top:8px; }
.stage > div { flex:1; min-width:220px; }
.grp { margin-bottom:8px; border-radius:6px; padding:4px; }
.c0 { background:#e3f2fd; } .c1 { background:#fff3e0; } .c2 { background:#e8f5e9; }
td.key { font-weight:bold; }
td.hl { background:#fff59d; }
.step { font-size:13px; padding:6px 8px; background:var(--soft); border-radius:6px; margin-top:6px; }
</style>
</head>
<body>
<h1>拆分—应用—合并：groupby 在做什么？</h1>
<div class="sub">选好“按哪一列分组”和“怎么算”，然后点“下一步”，看 8 笔订单怎样变成一张汇总表。</div>
<div class="row">
  <span>按</span><select id="by"><option value="城区">城区</option><option value="天气">天气</option></select>
  <span>分组，对“实付金额”求</span>
  <select id="fn"><option value="sum">sum（求和）</option><option value="mean">mean（平均）</option><option value="count">count（计数）</option><option value="max">max（最大）</option></select>
  <button class="main" id="next">下一步</button><button id="reset">从头开始</button>
</div>
<div class="step" id="step"></div>
<div class="stage">
  <div><b id="ltitle">原始订单表</b><div id="left"></div></div>
  <div id="rwrap" hidden><b>合并后的结果表</b><div id="right"></div></div>
</div>
<div class="note" id="code"></div>
<script>
(function () {
  var rows = [
    ["O001","天河","晴",86.5],["O002","越秀","雨",42.0],["O003","天河","雨",120.3],["O004","海珠","晴",58.8],
    ["O005","越秀","晴",73.6],["O006","天河","晴",35.2],["O007","海珠","雨",99.0],["O008","越秀","晴",64.1]
  ];
  var COL = {"城区":1, "天气":2}, stage = 0;
  var by = document.getElementById("by"), fn = document.getElementById("fn");
  var NAMES = {sum:"求和", mean:"平均", count:"计数", max:"最大值"};
  function agg(vals, f) {
    if (f === "count") return vals.length;
    if (f === "max") return Math.max.apply(null, vals).toFixed(1);
    var s = vals.reduce(function (a, b) { return a + b; }, 0);
    return (f === "sum" ? s : s / vals.length).toFixed(1);
  }
  function groups() {
    var g = {}, order = [];
    rows.forEach(function (r) { var k = r[COL[by.value]]; if (!g[k]) { g[k] = []; order.push(k); } g[k].push(r); });
    return order.map(function (k) { return [k, g[k]]; });
  }
  function table(rs, keyCol, hl) {
    var h = '<table class="t"><tr><th>订单号</th><th>城区</th><th>天气</th><th>实付金额</th></tr>';
    rs.forEach(function (r) {
      h += "<tr>" + r.map(function (v, i) {
        var c = (i === keyCol ? "key" : "") + (hl && i === 3 ? " hl" : "");
        return '<td class="' + c + '">' + (i === 3 ? v.toFixed(1) : v) + "</td>";
      }).join("") + "</tr>";
    });
    return h + "</table>";
  }
  function draw() {
    var kc = COL[by.value], gs = groups(), left = document.getElementById("left"), st = document.getElementById("step");
    document.getElementById("rwrap").hidden = stage < 3;
    var code = 'orders.groupby("' + by.value + '")["实付金额"].' + fn.value + "()";
    document.getElementById("code").innerHTML = "对应的代码：<code>" + code + "</code>；Excel 里相当于按“" + by.value + "”排序后做“分类汇总”。";
    if (stage === 0) {
      document.getElementById("ltitle").textContent = "原始订单表（8 行）";
      left.innerHTML = table(rows, kc);
      st.innerHTML = "第 0 步：这是一张小订单表。点“下一步”开始按“" + by.value + "”分组。";
      return;
    }
    document.getElementById("ltitle").textContent = "拆成 " + gs.length + " 张小表";
    left.innerHTML = gs.map(function (g, i) {
      var extra = stage >= 2 ? '<div style="font-size:13px;margin-top:2px">' + NAMES[fn.value] + "：<b>" + agg(g[1].map(function (r) { return r[3]; }), fn.value) + "</b></div>" : "";
      return '<div class="grp c' + (i % 3) + '"><b>' + by.value + " = " + g[0] + "</b>（" + g[1].length + " 行）" + table(g[1], kc, stage >= 2) + extra + "</div>";
    }).join("");
    if (stage === 1) st.innerHTML = "第 1 步 <b>拆分</b>：把“" + by.value + "”相同的行放在一起，原表被拆成 " + gs.length + " 张小表。";
    if (stage === 2) st.innerHTML = "第 2 步 <b>应用</b>：对每张小表的“实付金额”分别" + NAMES[fn.value] + "，每张小表只得到一个数。";
    if (stage >= 3) {
      var h = '<table class="t"><tr><th>' + by.value + "</th><th>实付金额（" + NAMES[fn.value] + "）</th></tr>";
      gs.forEach(function (g) { h += "<tr><td>" + g[0] + "</td><td>" + agg(g[1].map(function (r) { return r[3]; }), fn.value) + "</td></tr>"; });
      document.getElementById("right").innerHTML = h + "</table>";
      st.innerHTML = "第 3 步 <b>合并</b>：把每组的结果合成一张新表，分组列变成了结果表的行索引。8 行变成了 " + gs.length + " 行。换一种分组列或计算方式再试试。";
    }
  }
  document.getElementById("next").onclick = function () { stage = Math.min(stage + 1, 3); draw(); };
  document.getElementById("reset").onclick = function () { stage = 0; draw(); };
  by.onchange = fn.onchange = function () { if (stage > 0) stage = Math.max(stage, 1); draw(); };
  draw();
})();
</script>
</body>
</html>
