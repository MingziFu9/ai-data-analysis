<title>RFM 分群</title>

<style>
svg { width:100%; height:auto; display:block; background:#fafbfc; border-radius:6px; }

<body>
<h1>RFM 分群：拖动分档线，看用户落到哪一群</h1>
<div class="sub">从“食客说”4670 名用户中随机抽取 400 人。R 是最近一次下单距今的天数（越小越好），F 是全年下单次数，M 是全年消费金额。每个指标按分档线分成“好 / 差”两档，三个指标组合成 8 群。</div>
<div class="lab"><span>R：≤ 几天算“最近来过”</span><input type="range" id="r" min="3" max="120" step="1" value="21"><b id="rv"></b></div>
<div class="lab"><span>F：> 几次算“常来”</span><input type="range" id="f" min="1" max="40" step="1" value="9"><b id="fv"></b></div>
<div class="lab"><span>M：> 多少元算“花得多”</span><input type="range" id="m" min="100" max="5000" step="50" value="1150"><b id="mv"></b></div>
<div class="row"><button id="med" class="main">恢复为中位数（21 天 / 9 次 / 1150 元）</button></div>
<div class="grid2">
  <svg id="svg" viewBox="0 0 380 300"></svg>
  <div><table class="t" id="tb"></table></div>
</div>
<div class="msg" id="msg"></div>
<div class="note">散点图横轴是 F、纵轴是 M（都用对数坐标，避免少数大户把其他人挤在角落），R 用点的颜色区分：实心表示“最近来过”，空心表示“很久没来”。数据来自实验 9-2 的运行结果。</div>

  var G = [
    ["重要价值客户", 1, 1, 1, "#3f51b5", "重点维护，提供专属优惠和新品优先体验"],
    ["重要唤回客户", 0, 1, 1, "#e53935", "以前常来、花得多，最近没来：赶紧发券召回"],
    ["重要发展客户", 1, 0, 1, "#ff9800", "最近来过、单笔花得多但次数少：推荐会员、提高频率"],

    document.getElementById("rv").textContent = R + " 天"; document.getElementById("fv").textContent = F + " 次"; document.getElementById("mv").textContent = M + " 元";
