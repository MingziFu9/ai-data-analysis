<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目标框标注与交并比</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
#wrap { position:relative; max-width:640px; touch-action:none; }
#wrap img { width:100%; display:block; border-radius:6px; }
#wrap svg { position:absolute; left:0; top:0; width:100%; height:100%; cursor:crosshair; }
</style>
</head>
<body>
<h1>目标框标注与交并比：你的框和参考框重合了多少？</h1>
<div class="sub">选一个物体，在图上按住鼠标（或手指）拖出一个框。蓝色是你画的框，绿色虚线是参考框，黄色是两框重叠的部分。</div>
<div class="row" id="objs"></div>
<div id="wrap"><img src="table.jpg" alt="餐桌照片"><svg id="svg" viewBox="0 0 640 480"></svg></div>
<div class="row"><label><input type="checkbox" id="show" checked> 显示参考框</label></div>
<div class="grid2">
  <div class="box"><h2>交并比（IoU）</h2><div class="big" id="iou">—</div><div class="bar" id="bar" style="width:0"></div><div class="note" id="detail"></div></div>
  <div class="box"><h2>验收结果</h2><div class="big" id="verdict">—</div><div class="note">本书的图片标注规范规定：与参考框的交并比不低于 0.7 算合格（6.1.3 节）。</div></div>
</div>
<script>
(function () {
  var REF = [["左下的碗", 59, 255, 151, 347], ["右边的碗", 455, 271, 557, 373], ["中间的杯子", 282, 333, 350, 387]];
  var cur = 0, box = null, drag = null, svg = document.getElementById("svg");
  REF.forEach(function (r, i) { var b = document.createElement("button"); b.textContent = r[0]; b.id = "o" + i; b.onclick = function () { cur = i; box = null; draw(); }; document.getElementById("objs").appendChild(b); });
  function pt(e) { var r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 640, (e.clientY - r.top) / r.height * 480]; }
  svg.addEventListener("pointerdown", function (e) { drag = pt(e); box = [drag[0], drag[1], drag[0], drag[1]]; svg.setPointerCapture(e.pointerId); draw(); });
  svg.addEventListener("pointermove", function (e) { if (!drag) return; var p = pt(e); box = [Math.min(drag[0], p[0]), Math.min(drag[1], p[1]), Math.max(drag[0], p[0]), Math.max(drag[1], p[1])]; draw(); });
  svg.addEventListener("pointerup", function () { drag = null; });
  document.getElementById("show").onchange = draw;
  function rect(b, attrs) { return '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + (b[2] - b[0]) + '" height="' + (b[3] - b[1]) + '" ' + attrs + "/>"; }
  function draw() {
    REF.forEach(function (_, i) { document.getElementById("o" + i).className = i === cur ? "on" : ""; });
    var r = REF[cur].slice(1), h = "";
    if (document.getElementById("show").checked) h += rect(r, 'fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"');
    var iou = null;
    if (box && box[2] - box[0] > 2 && box[3] - box[1] > 2) {
      var ix = [Math.max(box[0], r[0]), Math.max(box[1], r[1]), Math.min(box[2], r[2]), Math.min(box[3], r[3])];
      var inter = Math.max(0, ix[2] - ix[0]) * Math.max(0, ix[3] - ix[1]);
      var a1 = (box[2] - box[0]) * (box[3] - box[1]), a2 = (r[2] - r[0]) * (r[3] - r[1]), uni = a1 + a2 - inter;
      iou = inter / uni;
      if (inter > 0) h += rect(ix, 'fill="#ffeb3b" fill-opacity=".55"');
      h += rect(box, 'fill="none" stroke="#1565c0" stroke-width="3"');
      document.getElementById("detail").innerHTML = "交集 " + Math.round(inter) + " ÷ 并集 " + Math.round(uni) + "（你的框 " + Math.round(a1) + " + 参考框 " + a2 + " − 交集）。单位：像素²";
    } else document.getElementById("detail").textContent = "在图上拖出一个框。";
    svg.innerHTML = h;
    document.getElementById("iou").textContent = iou === null ? "—" : iou.toFixed(2);
    document.getElementById("bar").style.width = (iou || 0) * 100 + "%";
    var v = document.getElementById("verdict");
    if (iou === null) { v.textContent = "—"; v.className = "big"; }
    else if (iou >= 0.7) { v.textContent = "合格"; v.className = "big ok"; }
    else { v.textContent = "不合格"; v.className = "big bad"; }
  }
  draw();
})();
</script>
</body>
</html>
