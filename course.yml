# ============================================================
# 课程配置：全书唯一需要手改的配置文件
# 改完后运行  python tools/course.py sync  ，会自动更新：
#   mkdocs.yml 的站点名和导航、首页课程信息与目录、缺少的章节骨架、
#   实验目录、术语表的章节小节、学习图谱的章节列表、附录编号
# 课件（tools/make_slides.py）、教案（tools/make_lesson_plan.py）、Word/PDF 版（tools/export_docx.py）
# 也从这里读取课程名、学时等信息
# ============================================================

title: 人工智能数据分析与处理          # 书名
description: 面向成人教育人工智能技术应用专业（专科）的《人工智能数据分析与处理》教材，零基础友好，12 章 36 个动手实验
audience: 成人教育（继续教育）人工智能技术应用专业专科学生，多为在职学习者
github_user: MingziFu9                # 网址 https://<github_user>.github.io/<repo>/
repo: ai-data-analysis            # GitHub 仓库名（用模板新建后改成本课的，如 ml-textbook）

credits: 4                            # 学分
hours: {theory: 54, lab: 18}          # 学时：理论 + 实验
semester: 4                           # 开课学期
exam: 开卷                            # 期末考核方式
labs_per_chapter: 3                   # 每章实验数；0 表示没有实验
lab_section: 本章实验                 # 实验部分的二级标题；导论用“在线体验”
lab_word: 实验                        # 每个实验的三级标题前缀（### 实验 N-M）；导论用“体验”
frontier_title: 前沿视窗              # 每章“前沿”小节的名称，导论用“身边的 AI”
certificates:                         # 对应的职业证书
  - name: 人工智能训练师（四级）
    issuer: 人力资源和社会保障部、工业和信息化部，《人工智能训练师国家职业技能标准》（2021 年版）
  - name: 人工智能数据处理工程师（中级）
    issuer: 工业和信息化部教育与考试中心，《人工智能数据处理工程师》培训课程标准（试行版，2022）
  - name: Python 技术应用工程师（中级）
    issuer: 工业和信息化部教育与考试中心（未找到官方考纲，依据培训机构转述）

# 章节：dir 是 docs/chapters/ 下的文件夹名（两位章号开头），short 用于学习图谱等窄处
# theory / lab 是本章学时；labs 可单独覆盖本章实验数；offline 可指定本章线下学时（不写则按 online_ratio 分）
chapters:
  - {dir: 01-overview, title: "数据分析与处理概述", short: "概述", theory: 4, lab: 1, offline: 1}
  - {dir: 02-pandas, title: "Python 数据处理入门：从表格到 pandas", short: "pandas 入门", theory: 5, lab: 2, offline: 1}
  - {dir: 03-collection, title: "数据采集：文件、数据库与接口", short: "数据采集", theory: 4, lab: 2, offline: 1}
  - {dir: 04-cleaning, title: "数据清洗与整合", short: "数据清洗", theory: 5, lab: 2, offline: 1}
  - {dir: 05-annotation, title: "数据标注：任务、规范与工具", short: "标注规范与工具", theory: 5, lab: 2, offline: 2}
  - {dir: 06-annotation-qa, title: "数据标注：质量审核与管理", short: "标注质量审核", theory: 4, lab: 2, offline: 2}
  - {dir: 07-statistics, title: "探索性分析与统计推断", short: "统计分析", theory: 5, lab: 1, offline: 1}
  - {dir: 08-visualization, title: "数据可视化与分析报告", short: "可视化与报告", theory: 5, lab: 2, offline: 1}
  - {dir: 09-modeling, title: "建模应用：从 scikit-learn 到预训练模型", short: "建模应用", theory: 5, lab: 1, offline: 1}
  - {dir: 10-recommendation, title: "推荐系统", short: "推荐系统", theory: 4, lab: 1, offline: 1}
  - {dir: 11-operations, title: "智能系统运维与优化", short: "系统运维", theory: 4, lab: 1, offline: 1}
  - {dir: 12-ethics-project, title: "数据伦理、隐私合规与综合项目", short: "合规与综合项目", theory: 4, lab: 1, offline: 1}

# 其他页面：追加在导航“常见问题”之后，如 extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]
extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]

# 附录：docs/appendix/ 下的文件，按顺序自动编号为 A、B、C……（术语表固定为 glossary.md）
appendices:
  - {file: a-python.md, title: Python 与 pandas 零基础入门}
  - {file: b-libraries.md, title: 常用工具速查}
  - {file: c-environment.md, title: 实验环境与数据说明}
  - {file: glossary.md, title: 术语表}
  - {file: e-templates.md, title: 报告与规范模板}

# 教案默认设置（每章可在 lesson-plans/chNN.yml 里覆盖）
lesson_plan:
  online_ratio: 0.5                   # 线上学时占比（开放大学以线上为主，按实际改）
  teacher: ""                         # 授课教师，留空则教案上留出填写位置
  school: ""                          # 学校名称，留空则不显示

# 首页“先玩一玩”轮播：按轮播顺序写，第 1 个放画面最震撼的。sim 是 docs/sims/ 下的目录名，hook 是一句问句，play 是一句玩法；
# steps 是录短视频时自动做的操作（写法见 编写规范.md“首页轮播”）。改完运行 python tools/showcase.py record 重录视频。
showcase_tagline: "AI 的燃料是数据：采集、清洗、标注、分析一条龙"
showcase:
  - sim: bbox-iou
    hook: "你画的框，和标准答案重合了多少？"
    play: "在真实照片上拖框，交并比实时算出来。"
    steps:
      - ["click", "左下的碗", {"hold": 1}]
      - ["click", "右边的碗", {"hold": 1}]
      - ["click", "中间的杯子", {"hold": 1.2}]
      - ["poster"]
  - sim: rfm-segments
    hook: "拖动三根门槛，把顾客分成八种人"
    play: "重要价值客户占多少？贡献了多少消费？"
    steps:
      - ["slide", "#r", 90, {"hold": 0.8}]
      - ["slide", "#f", 30, {"hold": 0.8}]
      - ["poster"]
      - ["slide", "#m", 4000, {"hold": 0.8}]
      - ["click", "#svg", {"hold": 0}]
      - ["click", {"role": "button", "name": "恢复为中位数", "exact": false}, {"hold": 1}]
  - sim: missing-outliers
    hook: "换一种方法，结果差了多少？"
    play: "3σ 和箱线图各揪出哪些“异常”订单。"
    steps:
      - ["click", "箱线图法（IQR）", {"hold": 1}]
      - ["slide", "#k", 1.5, {"hold": 1}]
      - ["poster"]
      - ["click", "填平均值", {"hold": 1}]
      - ["click", "按城区填中位数", {"hold": 1.2}]
  - sim: item-cf
    hook: "“去过这家店的人，也常去……”是怎么算出来的"
    play: "改一格打卡记录，推荐名单马上重排。"
    vw: 860
    steps:
      - ["click", "让小周也去火锅店", {"hold": 1.3}]
      - ["poster"]
      - ["click", "清空小陈", {"hold": 1.1}]
      - ["click", "恢复示例", {"hold": 1}]
  - sim: data-masking
    hook: "同一条记录，怎样既能分析又不泄露隐私？"
    play: "换一种脱敏方式，看可用性和风险此消彼长。"
    vw: 860
    steps:
      - ["click", "交给外部公司做标注", {"hold": 1.2}]
      - ["click", "看推荐做法", {"hold": 1.5}]
      - ["poster"]
      - ["click", "RFM 用户分群（第 9 章）", {"hold": 1}]
      - ["click", "看推荐做法", {"hold": 1.2}]
