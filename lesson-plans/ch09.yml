# 第 9 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 9
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出特征、标签、训练集、测试集、数据泄露的含义，以及回归、分类、聚类分别解决什么问题
  - 解释为什么要留出测试集、为什么要和基准比较，以及准确率高不等于模型好用的原因
  skill:
  - 运行并修改给定代码，用 scikit-learn 流水线完成送达时长预测和评论情感分类，写出测试报告和错误案例分析
  - 运行并修改给定代码，计算 RFM、给用户分群，并为每一群提出运营建议
  - 判断什么时候可以用模型或大模型做预标注，说出成本和风险
  quality:
  - 用测试集客观评价模型，不夸大模型效果
  - 使用大模型等外部服务时保护个人信息
key_points:
- 机器学习速记
- scikit-learn 的基本用法
- 回归：预测送达时长
- 分类：评论情感分类
difficulties:
- point: 训练集与测试集的意义和数据泄露
  solution: 用“背答案考试”比喻；举出用评分预测情感等泄露例子让学生判断
- point: 精确率和召回率的区别
  solution: 用“找差评”的场景：判为差评的有多少真是差评、真差评找出了多少；对照混淆矩阵计算
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 90
    content: 阅读网页教材第 9 章 建模应用：从 scikit-learn 到预训练模型的情景导入和第一节，操作交互动画“RFM 分群”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：“食客说”的运营经理给数据组提了三个需求：


      第一，顾客下单时，App 上要显示“预计 xx 分钟送达”。现在是所有订单……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 回归、分类、聚类；训练集与测试集；scikit-learn 三步
    teacher: 演示实验 9-1 的流水线代码，对比基准与模型的误差
    student: 听讲、操作动画、回答提问、记录要点
    intent: 建立“和基准比”的评估意识
  - name: 重点讲授
    minutes: 10
    content: 测试报告：准确率、混淆矩阵、精确率、召回率；错误案例；RFM 分群；预标注
    teacher: 讲解混淆矩阵，用动画“RFM 用户分群”演示，讨论各群的运营建议
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应 Python 技术应用工程师建模，突破难点二
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 9-1、9-2，提醒保存情感模型供第 11 章使用
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：回答情景导入中的三个需求分别属于哪类机器学习任务，各需要什么数据。
- 简答题：为什么评估回归模型时要和“都猜平均值”的基准比较？
- 简答题：给“偶尔光顾”（R 中位数 46 天、F 5 单、M 590 元）的用户群写一条具体的运营建议。
- 实操题：在实验 9-1 的送达时长预测中，再加入一个特征“深夜”（22 点到次日 5 点下单记 1），比较平均绝对误差的变化。
- 实操题：用实验 9-1 保存的情感模型，预测下面三条评论的情感和把握：“送到都凉了 不会再来了😡”“中规中矩”“环境很好，就是有点贵，推荐”。
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
