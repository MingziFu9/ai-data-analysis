# 第 3 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 3
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出常见的数据源和采集方式，以及 CSV、Excel、JSON、Parquet 四种文件格式各自的特点
  - 解释乱码产生的原因、接口返回的状态码含义，以及为什么采集要分页、限流和重试
  skill:
  - 运行并修改给定代码，读取 GBK 编码的 CSV、多工作表 Excel 和嵌套 JSON，把它们整理成一张表
  - 运行并修改给定的 SQL 语句，从数据库中按条件取数、分组汇总
  - 判断一个网页采集需求是否合规，写出一份简单的采集方案
  quality:
  - 遵守数据采集的法律边界，树立“公开的数据也不能随便爬”的合规意识
  - 像“有礼貌”的采集程序一样尊重数据提供方：限流、重试、写日志
key_points:
- 数据从哪里来
- 文件采集：CSV、Excel、JSON 与 Parquet
- 从数据库取数：SQL 入门
- 开放接口：一页一页地取数据
difficulties:
- point: 乱码的成因和排查方法
  solution: 现场用 UTF-8 读 GBK 文件制造报错，再换编码读对；用字节数解释 UTF-8 和 GBK 的区别
- point: 接口的分页、限流、重试和增量采集
  solution: 启动本地模拟接口，演示一次完整的分页采集，并让学生观察采集日志中的 429 和重试
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 90
    content: 阅读网页教材第 3 章 数据采集：文件、数据库与接口的情景导入和第一节；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：“食客说”要做一个“评论情感分析”模型，第一步是把数据凑齐。数据组的小周接到任务后列了一张清单，发现要的数据散落在五六个……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 文件编码与乱码；Excel 多工作表；JSON 展平；SQL 的 SELECT、WHERE、GROUP BY、JOIN
    teacher: 演示读取 ch03 文件夹中的四种文件；对照 pandas 写出等价的 SQL
    student: 听讲、操作动画、回答提问、记录要点
    intent: 掌握最常用的三种取数方式
  - name: 重点讲授
    minutes: 10
    content: 接口状态码、分页、限流与重试；网页采集的法律边界；采集方案
    teacher: 讨论情景导入中“爬竞争对手评论”的需求，引导学生说出不能做的理由和替代办法
    student: 听讲、操作动画、回答提问、记录要点
    intent: 落实合规意识，对应训练师四级业务数据采集
  - name: 实验答疑
    minutes: 10
    content: 演示实验 3-3 的两个窗口操作（先启动 mock_api.py），答疑实验 3-1、3-2
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：同事发来一个 CSV 文件，你用 `pd.read_csv` 读取时报错 `UnicodeDecodeError`。请写出你的排查步骤。
- 简答题：为什么调用接口采集数据时要分页、限流和重试？各解决什么问题？
- 简答题：产品经理让你“把竞争对手网站上的评论都爬下来做对比”，你会怎么回应？
- 实操题：用 SQL 从 `shike.db` 中统计 2025 年各菜系的订单数和平均实付金额（保留 1 位小数），按订单数从多到少排序。
- 实操题：读取 `商家评分_按城区.xlsx` 的全部工作表，在拼接时加一列“来源工作表”，记录每行来自哪个工作表，然后统计每个城区的平均评分。
- 实验报告：实验 3-1、实验 3-2、实验 3-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
