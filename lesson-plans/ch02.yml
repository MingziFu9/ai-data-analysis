# 第 2 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 DataFrame、Series、索引、数据类型的含义，以及 pandas 常用操作对应的 Excel 操作
  - 解释分组统计“拆分—应用—合并”的过程，以及四种表格连接方式的区别
  skill:
  - 运行并修改给定代码，完成读表、筛选、排序、新增列、分组统计、透视表和两表合并
  - 运行并修改给定代码，把文字形式的时间转换成日期时间，按月、按小时统计订单
  - 判断一次合并后行数变多是否正常，找出原因
  quality:
  - 体会用代码代替重复的手工操作，养成可复现、可核对的工作习惯
  - 合并数据后主动核对行数，形成严谨细致的态度
key_points:
- Python 热身：够用就好
- 从 Excel 到 pandas
- 选行选列、筛选、排序、新增列
- 分组统计与透视表
difficulties:
- point: groupby + agg 的写法和“拆分—应用—合并”的过程
  solution: 先用 Excel 分类汇总做一遍，再用动画“拆分—应用—合并”演示每一步的中间结果，最后对照代码
- point: merge 的四种连接方式，以及合并后行数变多
  solution: 用动画“四种连接方式”切换 inner、left、right、outer；故意用有重复键的右表合并，让学生发现行数变多
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 108
    content: 阅读网页教材第 2 章 Python 数据处理入门：从表格到 pandas的情景导入和第一节，操作交互动画“拆分—应用—合并”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林每个月初都要给老板交一份“上月经营简报”：各城区的订单数和销售额、各菜系的客单价、哪个时段订单最多。以前他的做法是：……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: Excel 操作与 pandas 写法对照：读表、筛选、排序、新增列
    teacher: 边讲边在 Jupyter 中演示，每个操作先说 Excel 怎么做，再写 pandas 代码
    student: 听讲、操作动画、回答提问、记录要点
    intent: 借助已有的 Excel 经验降低入门难度
  - name: 重点讲授
    minutes: 10
    content: 分组统计、透视表与 merge 合并
    teacher: 用两个动画演示，再运行实验 2-2 的代码，核对合并前后的行数
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破本章两个难点
  - name: 实验答疑
    minutes: 10
    content: 巡视实验 2-1、2-2，集中讲评筛选条件忘加括号、透视表 aggfunc 用错等常见错误
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 162
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话解释分组统计的“拆分—应用—合并”，以“按菜系统计平均客单价”为例。
- 简答题：什么情况下合并后的行数会变多？怎样检查？行数变多一定是错的吗？
- 简答题：小林说：“我用 for 循环一行一行算新列，结果也是对的，为什么非要学向量化？”请你回答他。
- 实操题：统计每种配送方式的订单数、平均送达时长和最长送达时长。
- 实操题：做一张透视表：行是天气，列是配送方式，值是订单数。雨天的订单占全部订单的比例约是多少？
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
