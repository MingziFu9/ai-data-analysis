# 第 7 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 7
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出平均值、中位数、标准差、分位数、相关系数、置信区间、p 值的含义
  - 解释为什么长尾数据要看中位数、为什么相关不等于因果，以及辛普森悖论产生的原因
  skill:
  - 运行并修改给定代码，对订单数据做描述统计、分组对比和相关分析，写出分析发现
  - 运行并修改给定代码，完成 t 检验、卡方检验和 A/B 测试，并用一句话正确地说出结论
  - 判断一个统计结论是否可靠，指出常见的误读
  quality:
  - 培养实事求是的科学态度：不夸大、不误读统计结论
  - 养成“相关不等于因果”的批判性思维
key_points:
- 描述统计：用几个数字概括一列数
- 探索性分析的套路
- 相关分析：两个变量一起变吗
- 总体、样本与置信区间
difficulties:
- point: p 值的含义和常见误读
  solution: 用“碰巧出现这么大差别的概率”的说法反复解释；逐条辨析误读表中的四种说法
- point: 辛普森悖论
  solution: 先展示合起来看的结果让学生下结论，再按城区拆开，制造认知冲突后分析原因
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 90
    content: 阅读网页教材第 7 章 探索性分析与统计推断的情景导入和第一节，操作交互动画“抽样与置信区间”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: '情景导入：月度经营会上，三位同事各自汇报了一个“发现”。


      运营小王说：“我们的平均客单价是 133 元，说明大部分顾客一单花一百……'
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 平均值与中位数；探索性分析的套路；相关不等于因果；辛普森悖论
    teacher: 用情景导入中小王、小陈的结论引出，现场拆开数据
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破难点二
  - name: 重点讲授
    minutes: 10
    content: 置信区间、假设检验和 p 值；A/B 测试的设计与判读
    teacher: 用动画“置信区间”“A/B 测试”演示；判读小李的结论（p = 0.279）
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破难点一，会读检验结论
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 7-1、7-2，讲评学生写的检验结论是否规范（差别多大、置信区间、p 值）
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：情景导入中三位同事的结论分别错在哪里？
- 简答题：简述假设检验的思路，并说明 p 值的含义。
- 简答题：写出实验 7-3 规范 A/B 测试的结论，要求说清“差多少、有多确定、值不值得”。
- 实操题：用 t 检验比较晴天和雨天的送达时长，写出结论。
- 实操题：计算“食客说”2025 年每个月的复购率（当月下单 2 次及以上的用户 ÷ 当月下单用户数），哪个月最高？和全年复购率 93.4% 相比如何？
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
