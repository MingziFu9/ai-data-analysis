# 第 8 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 8
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出比较、趋势、构成、分布、关系、地理六类问题分别适合用什么图表
  - 解释截断纵轴、饼图切太多块、双纵轴、只截一段时间这四种图表为什么会误导人
  skill:
  - 运行并修改给定代码，用 Matplotlib 和 seaborn 画出 8 种常用图表，并改正误导性图表
  - 运行并修改给定代码，用 pyecharts 做交互图表和网页看板，或用 WPS / Excel 做数据透视图
  - 写出一份结构完整、结论有数据支撑的数据分析报告，并评价别人的报告
  quality:
  - 诚实地呈现数据，不制作误导性图表
  - 站在读者的角度写报告：结论先行、建议可执行
key_points:
- 图表选择：先问“想回答什么问题”
- 用 Matplotlib 和 seaborn 画常用图表
- 不写代码也能画：数据透视图与 BI 工具
- 误导性图表：图会“说谎”
difficulties:
- point: 根据问题选择合适的图表
  solution: 用动画“图表选择器”让学生为六个问题选图，讨论选错的后果
- point: 把分析结果组织成结论先行的报告
  solution: 对比小林的“6 页数字”和改写后的报告摘要，让学生找出差别
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 108
    content: 阅读网页教材第 8 章 数据可视化与分析报告的情景导入和第一节，操作交互动画“图表选择与纠错”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：上一章，小林用描述统计和假设检验找到了好几条有价值的发现。他把这些发现写成一份 6 页的 Word 文档，满满都是数字和……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 图表选择；一张好图的五个要素；四种误导性图表
    teacher: 展示实验 8-1 的误导性图表，请学生找出问题并说出改法
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应数据处理工程师可视化，培养诚实呈现的意识
  - name: 重点讲授
    minutes: 10
    content: 交互看板；数据分析报告的结构和讲故事的方法
    teacher: 演示 pyecharts 和 Streamlit 看板；带学生把一条发现改写成“结论 + 图 + 数字”
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破难点二
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 8-1、8-2，演示 streamlit run 的启动方法
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 162
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：情景导入中，小林的三维饼图和柱状图各有什么问题？应该怎样改？
- 简答题：一个数据看板由哪几部分组成？各起什么作用？
- 简答题：把下面这条建议改写成可执行的建议：“我们要提高配送效率，改善顾客体验。”
- 实操题：画一张“各城区平均送达时长”的条形图，要求从大到小排序、纵轴从 0 开始、标出数值，并说明各城区之间差别大不大。
- 实操题：用 pyecharts 画一张“各菜系订单数”的柱状图，生成网页并截图。
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
