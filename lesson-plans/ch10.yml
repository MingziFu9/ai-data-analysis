# 第 10 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 10
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出用户—物品矩阵、显式反馈与隐式反馈、召回与排序、冷启动的含义
  - 解释热门推荐、基于内容的推荐、协同过滤、矩阵分解各自的思路和优缺点
  skill:
  - 运行并修改给定代码，计算余弦相似度，完成基于内容的推荐和基于物品的协同过滤
  - 运行并修改给定代码，按时间切分数据，用命中率、召回率、覆盖率比较几种推荐方法
  - 判断一个推荐方案是否合理，说出信息茧房和算法推荐的合规要求
  quality:
  - 认识推荐算法的社会影响，警惕信息茧房
  - 做推荐之前先理解用户的真实需求
key_points:
- 推荐系统在做什么
- 热门推荐与基于内容的推荐
- 协同过滤
- 矩阵分解：找出“隐含口味”
difficulties:
- point: 协同过滤“只看行为、不看内容”的思路
  solution: 用动画“物品协同过滤”点选店铺，观察相似店的顾客名单重合
- point: 按时间切分的离线评估和各指标的含义
  solution: 画时间轴说明训练期和评估期；用比较表解释命中率、召回率、覆盖率
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 72
    content: 阅读网页教材第 10 章 推荐系统的情景导入和第一节，操作交互动画“协同过滤计算器”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：“食客说”App 首页有一块“猜你喜欢”，目前放的是全平台订单最多的 10 家餐厅，每个用户看到的都一样。运营经理发现了……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 用户—物品矩阵；热门推荐；基于内容的推荐；相似度
    teacher: 讨论“只用菜系推荐为什么比热门还差”，引出用户选店看距离
    student: 听讲、操作动画、回答提问、记录要点
    intent: 培养从数据中发现业务规律的能力
  - name: 重点讲授
    minutes: 10
    content: 协同过滤；召回与排序；冷启动；离线评估与信息茧房
    teacher: 用动画演示物品协同过滤，展示几种方法的比较表
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应数据处理工程师智能推荐
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 10-1、10-2，讲评几种方法比较的结论
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：比较基于内容的推荐和基于物品的协同过滤：它们计算“物品相似度”时用的向量分别是什么？各有什么优缺点？
- 简答题：情景导入中，花都用户抱怨推荐的都是远处的店、新店上不了推荐。结合本章内容，提出改进方案。
- 简答题：为什么推荐系统的离线评估要按时间切分？只评估“测试期第一次去的新店”又是为什么？
- 实操题：用实验 10-2 的 `item_sim`，找出和“鲜城火锅（越秀店）”（S0294）最相似的 5 家店，看它们在哪些城区。
- 实操题：给实验 10-2 增加一种推荐方法“本区热门”（按用户的常住城区推荐本区订单最多、他没去过的店），并和协同过滤比较命中率。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
