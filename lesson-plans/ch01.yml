# 第 1 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出一个人工智能项目中数据要经过的主要环节，以及人工智能训练师四级的三个职业功能
  - 区分结构化、半结构化和非结构化数据，以及数值型、类别型和时间序列数据
  - 解释数据分析、数据处理、数据标注三者的关系，说明“数据决定模型上限”的含义
  skill:
  - 运行并修改给定代码，完成环境自检，读入“食客说”的四张表并生成数据字典初稿
  - 找出一段数据分析代码中的错误，并说明错在哪里
  quality:
  - 树立“数据质量决定模型上限”的意识，养成核对数据的习惯
  - 理解数据岗位的职业守则，形成保守秘密、实事求是的职业态度
key_points:
- 数据在人工智能项目中的位置
- 数据分析、数据处理与数据标注
- 数据有哪些类型
- 数据岗位与职业道德
difficulties:
- point: 分清数据处理、数据标注、数据分析三个概念
  solution: 用“食客说”评论情感分析项目的同一份数据，依次说明三者分别回答什么问题、产出什么
- point: 第一次安装环境和运行程序时的各种报错
  solution: 现场演示一次 FileNotFoundError，带学生读报错最后一行；按附录 C 逐步排查
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 72
    content: 阅读网页教材第 1 章 数据分析与处理概述的情景导入和第一节，操作交互动画“数据的旅程”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林在一家叫“食客说”的城市美食点评平台做运营。平台上有 300 家合作餐厅、5000 多位常用用户，2025 年一年产……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 数据的旅程与数据闭环；三个概念与四类分析；CRISP-DM 六个阶段
    teacher: 用动画“数据的旅程”串讲全书主线，提问每个环节对应哪一章
    student: 听讲、操作动画、回答提问、记录要点
    intent: 建立全书的整体框架
  - name: 重点讲授
    minutes: 10
    content: 数据类型的两种分法；“食客说”四张表的关系；训练师四级的三个职业功能和职业守则
    teacher: 出示四张表的字段，请学生判断每列的类型；讨论“把工作数据发到微信群”有什么问题
    student: 听讲、操作动画、回答提问、记录要点
    intent: 联系岗位和证书要求，落实职业道德
  - name: 实验答疑
    minutes: 10
    content: 现场帮助学生完成实验 1-1 环境自检，演示实验 1-2 读入四张表、生成数据字典
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明数据处理、数据标注、数据分析三者的区别和联系，各举一个“食客说”平台中的例子。
- 简答题：为什么说“数据标注是人工智能训练师四级考试的重中之重”？本书怎样安排这部分内容？
- 简答题：小王用大模型写了一段统计各菜系“平均客单价”的代码，程序顺利运行并输出了结果。他说：“没报错，结果肯定对。”你同意吗？请给出至少三种检查方法。
- 实操题：修改实验 1-1 的程序，画出“各城区商家数”的柱状图，并写出商家最多和最少的城区。
- 实操题：参照实验 1-2，统计评论表中“评分”一列每个分数各有多少条评论（提示：`value_counts()`），并判断评论以好评为主还是差评为主。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
