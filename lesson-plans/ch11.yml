# 第 11 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 11
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出批量预测与在线服务、业务 / 模型 / 系统三类监控指标、数据漂移与概念漂移、数据闭环的含义
  - 解释模型上线后为什么会“变差”，PSI 是怎样衡量分布变化的
  skill:
  - 运行并修改给定代码，从运行日志中统计调用量、延迟、错误率和预测分布，设置告警规则
  - 运行并修改给定代码，计算 PSI、找出新出现的说法，收集坏案例并归因
  - 写出一份运维报告和一份能被执行的优化需求
  quality:
  - 树立持续运维、闭环改进的责任意识
  - 发现问题时用数据和证据沟通，写出别人能执行的需求
key_points:
- 智能系统怎样上线
- 日常维护：运行日志与监控指标
- 数据漂移与概念漂移
- 坏案例：收集、归类、归因
difficulties:
- point: 区分系统问题、数据漂移和概念漂移
  solution: 用监控看板分别指出第 7 周的延迟问题和第 5 周起的预测分布变化，讨论各由谁解决
- point: PSI 的计算思路和判断标准
  solution: 用动画“数据漂移与 PSI”给评论加新说法，观察各箱占比和 PSI 的变化
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 72
    content: 阅读网页教材第 11 章 智能系统运维与优化的情景导入和第一节，操作交互动画“数据漂移与 PSI”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：2026 年 3 月初，第 9 章训练的评论情感模型正式上线：每来一条新评论，系统就调用模型判断情感，判为负面的自动推送……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 上线方式与灰度发布；运行日志；三类监控指标与告警
    teacher: 展示实验 11-1 的监控看板，请学生找出异常并判断原因
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级智能系统维护，突破难点一
  - name: 重点讲授
    minutes: 10
    content: 数据漂移与 PSI；坏案例归因；数据闭环；运维报告与优化需求
    teacher: 用动画演示 PSI；展示补标重训前后的准确率；带学生写一条优化需求
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级智能系统优化
  - name: 实验答疑
    minutes: 10
    content: 答疑实验 11-2、11-3，讲评学生写的优化需求是否有证据、有验收标准
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：回答情景导入中运营经理的问题：模型是不是坏了？要不要重新训练？请用本章的数据说明。
- 简答题：什么是数据闭环？画出（或用文字写出）它的主要环节。
- 简答题：数据漂移和概念漂移有什么区别？各举一个“食客说”的例子。
- 实操题：用实验 11-1 的日志，按星期几（星期一到星期日）统计平均延迟，看看周末的延迟和工作日有没有差别。
- 实操题：用 `psi` 函数比较第 1 周和第 8 周的延迟分布，判断属于哪个等级。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
