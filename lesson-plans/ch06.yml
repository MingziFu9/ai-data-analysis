# 第 6 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 6
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出衡量标注质量的四个指标（准确率、一致率、Kappa、交并比）和标注审核的一般流程
  - 解释Kappa 为什么要扣除“碰巧一致”，以及抽检验收为什么会误判
  skill:
  - 运行并修改给定代码，计算几名标注员之间的一致率和 Kappa，找出分歧样本
  - 运行并修改给定代码，对一批标注按方案抽检验收，并写出标注审核报告
  - 判断一批标注是否合格、哪些需要返工，说明理由和依据
  quality:
  - 用数据说话，评价他人工作时客观公正、有理有据
  - 认识抽检的误判风险，既不放过问题，也不冤枉他人
key_points:
- 怎样衡量标注质量
- 抽检验收
- 审核流程与审核报告
- 多人标注与噪声标签
difficulties:
- point: Kappa 系数的含义：为什么一致率高不等于标得好
  solution: 用“两人都偷懒标正面”的例子计算 Kappa，再用动画“Kappa 计算器”改混淆表观察变化
- point: 抽检方案的设计和加抽的理由
  solution: 用动画“抽检验收”演示不同抽检条数下的误判概率；对照实验 6-2 中 W02、W04 加抽后合格的结果
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 72
    content: 阅读网页教材第 6 章 数据标注：质量审核与管理的情景导入和第一节，操作交互动画“Kappa 计算器”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：“食客说”的评论标注项目扩大了：外包公司派来了 4 名标注员（工号 W01 到 W04），一周交来一批 2000 条情感……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 标注准确率、一致率、Kappa、交并比
    teacher: 板书 Kappa 计算过程，用动画演示，讲解取值标准
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级标注审核，突破难点一
  - name: 重点讲授
    minutes: 15
    content: 分层抽检、合格判定与加抽；多级审核流程；审核报告
    teacher: 展示实验 6-2 的抽检结果，请学生判定每个标注员是否合格，并说出依据
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破难点二
  - name: 重点讲授
    minutes: 15
    content: 多数投票、cleanlab、预标注与主动学习
    teacher: 展示主动学习曲线和 cleanlab 找出的可疑标签，讨论最终由谁决定
    student: 听讲、操作动画、回答提问、记录要点
    intent: 了解提高标注质量和效率的方法
  - name: 实验
    minutes: 30
    content: 完成实验 6-2 的审核报告，同桌互评：报告的每个结论是否都有数字支撑
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：为什么说 Kappa 系数比一致率更能反映标注的一致性？
- 简答题：简述标注项目多级审核的流程，以及每一级的作用。
- 简答题：预标注能提高效率，但可能带来什么风险？怎样应对？
- 实操题：用 `three_annotators.csv`，计算标注员 A 与金标准之间的 Kappa，以及 C 与金标准之间的 Kappa，比较两人的差距。
- 实操题：写一个函数 `iou(a, b)`，输入两个框（x_min, y_min, x_max, y_max），返回交并比。用 6.1.3 节表格中的三个框检验。
- 实验报告：实验 6-1、实验 6-2、实验 6-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
