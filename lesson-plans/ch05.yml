# 第 5 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 5
online: 5
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出常见的数据标注任务类型，以及每类任务的标注结果长什么样
  - 解释标签体系“互斥、完整、粒度合适”的含义，以及 BIO 标注、COCO 和 YOLO 格式的规则
  skill:
  - 编写一份包含定义、正反例、边界规则和疑难样例的标注规范，并通过试标修订它
  - 运行Label Studio，配置标注模板，完成文本和图像标注，导出结果并用给定代码转成训练表
  - 判断一条评论、一张图片按规范应该怎样标注，说出依据的是规范中的哪一条
  quality:
  - 认识标注员的责任：一时马虎，模型永远记错
  - 在团队中按统一规范工作，遇到拿不准的情况及时提出而不是随便标
key_points:
- 为什么人工智能需要标注数据
- 常见的标注任务
- 设计标签体系
- 编写标注规范
difficulties:
- point: 边界规则的制定：好坏都有的评论怎么标
  solution: 全班独立标注 10 条疑难评论，统计分歧，讨论后写成边界规则，体会规范是“试标出来的”
- point: Label Studio 标注模板（XML）的含义和导出格式的转换
  solution: 对照标注界面逐行讲模板；用一个框的例子对比参考坐标、COCO 和 YOLO 三种写法
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 90
    content: 阅读网页教材第 5 章 数据标注：任务、规范与工具的情景导入和第一节，操作交互动画“实体标注练习”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：“食客说”想让程序自动判断每条评论是好评还是差评，这样就能每天自动统计各家商家的口碑，差评多了及时提醒商家。技术部说：“……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 15
    content: 标注的作用；常见标注任务；BIO；标签体系的三个要求
    teacher: 用动画“实体标注与 BIO”“画框与交并比”演示；请学生为评论设计标签体系
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级数据标注
  - name: 重点讲授
    minutes: 15
    content: 标注规范的组成；边界规则；先试标再定稿
    teacher: 组织全班试标 10 条，比较分歧，现场修订边界规则
    student: 听讲、操作动画、回答提问、记录要点
    intent: 体验规范的形成过程，突破难点一
  - name: 重点讲授
    minutes: 15
    content: Label Studio 建项目、配模板、标注、导出
    teacher: 投屏完整演示一遍，学生跟做
    student: 听讲、操作动画、回答提问、记录要点
    intent: 为实验 5-2 做准备
  - name: 实验
    minutes: 30
    content: 现场完成实验 5-2：每人标注 20 条评论并导出 JSON，转换成训练表；解决安装和端口问题
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是标签体系的“互斥、完整、粒度合适”？各举一个违反的例子。
- 简答题：为什么标注规范要先试标再定稿？试标后发现分歧应该怎么处理？
- 简答题：说明 Label Studio 标注模板中 `Text`、`Choices`、`Labels`、`RectangleLabels` 四种部件的作用。
- 实操题：修改实验 5-2 的转换程序，统计 100 条评论中每个菜品被提到的次数，输出前 5 名。
- 实操题：写一个函数 `coco_to_yolo(bbox, W, H)`，输入 COCO 的 bbox 和图片宽高，返回 YOLO 的中心点 x、y 和宽、高（比例）。用 `[426, 8, 98, 98]`、640、480 检验。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
