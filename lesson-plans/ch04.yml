# 第 4 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 4
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出数据质量的六个维度，以及每个维度常见的问题
  - 解释几种缺失值处理方法的利弊，以及为什么“异常值不一定是错误”
  skill:
  - 运行并修改给定代码，检查一张表的数据质量，写出数据质量评估表
  - 运行并修改给定代码，按清洗规范处理重复、缺失、异常、格式和单位问题，并核对清洗前后的结果
  - 判断一个异常值或缺失值应该删除、修正、填充还是保留，并说明理由
  quality:
  - 坚持“先评估、再清洗、后核对”，不凭感觉删改数据
  - 理解“异常不一定是错误”，尊重数据背后的业务事实
key_points:
- 数据质量：从哪几个方面检查
- 重复值与主键
- 缺失值：删、填，还是留着
- 异常值：异常不一定是错误
difficulties:
- point: 异常值的判断：统计方法找出来的不一定是错误
  solution: 用 3σ 法则和箱线图法对实付金额各找一遍，查看找出的大单的就餐人数，讨论哪些该保留
- point: 正则表达式的写法
  solution: 用动画“正则表达式实验室”逐个试手机号、广告词、重复标点的规则，从简单到复杂
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 108
    content: 阅读网页教材第 4 章 数据清洗与整合的情景导入和第一节，操作交互动画“缺失值与异常值处理”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小周把订单数据交给分析组的小林，没过半天小林就找上门来：“你给的数据有问题啊。我按城区算销售额，怎么出来 16 个城区？……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 数据质量六个维度；把检查写成规则；重复值、缺失值的处理方法
    teacher: 展示实验 4-1 的质量评估表，请学生说出每一项属于哪个维度、该怎么处理
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级业务数据处理
  - name: 重点讲授
    minutes: 10
    content: 异常值的处理决策；格式与单位统一；正则表达式；清洗规范
    teacher: 用“先问为什么，再决定怎么办”的表格讲解四种情况；演示评论清洗函数
    student: 听讲、操作动画、回答提问、记录要点
    intent: 形成按规范清洗的工作方法
  - name: 实验答疑
    minutes: 10
    content: 巡视实验 4-2，检查学生是否先备份、删除重复后是否为 8000 行、每条规则处理的行数是否记录
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 162
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是数据质量的六个维度？各举一个“食客说”订单表中的例子。
- 简答题：为什么说“异常值不一定是错误”？发现异常值后应该怎样处理？
- 简答题：团队为什么要先写清洗规范再动手清洗？一份清洗规范每条规则应写清哪些内容？
- 实操题：在实验 4-2 清洗后的订单表 `orders_clean.csv` 上，用箱线图法找出“送达时长”的异常值，有多少行？它们有什么共同特点？
- 实操题：写一个函数 `mask_phone(text)`，把文字中的手机号中间四位换成星号，例如“18545161843”变成“185****1843”。用它处理 `reviews_raw.csv`，有多少条评论被修改？
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
