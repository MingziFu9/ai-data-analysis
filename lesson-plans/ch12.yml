# 第 12 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 12
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出个人信息、敏感个人信息、知情同意、最小必要、去标识化与匿名化的含义，以及相关法律法规的名称
  - 解释数据分类分级的思路，以及样本偏差为什么会导致算法对一部分人不公平
  skill:
  - 运行并修改给定代码，识别数据中的个人信息，按场景选择掩码、哈希、泛化、扰动等脱敏方法
  - 运行并修改给定代码，对数据处理流程做合规检查，提出整改措施
  - 完成一个从采集、清洗、标注、分析到合规检查的综合项目，并提交项目报告
  quality:
  - 遵守个人信息保护法律法规，在数据工作中主动做好脱敏和合规检查
  - 关注算法公平，避免数据偏差伤害特定人群
key_points:
- 数据工作中的伦理问题
- 法规要点：个人信息保护
- 数据分类分级
- 脱敏方法
difficulties:
- point: 去标识化与匿名化的区别、准标识符的重识别风险
  solution: 现场计算“性别 + 年龄段 + 城区 + 注册日期”组合唯一的比例（94.3%），再泛化到年份对比
- point: 综合项目的选题和组织
  solution: 展示三个选题和评分标准，课上完成分组和选题，布置第 1 周的项目计划
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 72
    content: 阅读网页教材第 12 章 数据伦理、隐私合规与综合项目的情景导入和第一节，操作交互动画“数据脱敏演示”；完成本章 ★ 实验，填写实验记录表
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：“食客说”准备和一家连锁餐饮集团合作，集团的数据部门发来一封邮件：“为了做联合营销，请把你们平台上在我们门店消费过的用户……
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 伦理问题；法律法规；个人信息与敏感个人信息；处理原则；数据分类分级
    teacher: 讨论情景导入中的三件事是否合规、怎样整改
    student: 听讲、操作动画、回答提问、记录要点
    intent: 对应训练师四级职业道德与法律法规
  - name: 重点讲授
    minutes: 10
    content: 四种脱敏方法；去标识化与匿名化；算法偏见与样本偏差
    teacher: 用动画“数据脱敏”演示；展示只用平台专送数据训练造成的偏差
    student: 听讲、操作动画、回答提问、记录要点
    intent: 突破难点一
  - name: 实验答疑
    minutes: 10
    content: 综合项目分组、选题，讲解起步代码和交付要求
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章 3 道课堂练习（单选、多选、判断各 1 道）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 18 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是“最小必要”原则？结合“食客说”举一个违反和一个遵守这条原则的例子。
- 简答题：比较掩码、哈希、泛化、扰动四种脱敏方法，各适合什么场景？
- 简答题：回顾全书，列出本书的数据处理流程中可能涉及个人信息的三个环节，并分别提出保护措施。
- 实操题：写一个函数，把身份证号脱敏为“前 6 位 + 8 个 * + 后 4 位”，并用 `"440106199001011234"` 测试。
- 实操题：在实验 12-1 的基础上，把注册日期泛化到“年”，再计算“性别 + 年龄段 + 常住城区 + 注册年份”组合中独一无二的用户比例。
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
